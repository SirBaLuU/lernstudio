<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lernstudio</title>
<meta name="description" content="Kurze Lerneinheiten mit Abfrage, Wiederholung nach Plan und Prüfungsmodus für den HTL-Unterricht.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script defer src="figuren.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Lernstudio, Bibliothek">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="16" cy="16" r="4.5" fill="var(--dose)"/><path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span>Lernstudio</span>
    </a>
    <a class="topic-pill" id="topicPill" href="#home" hidden><i></i><span></span></a>
    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
    <span class="pill num" id="streakPill" title="Lernserie in Tagen"></span>
    <a class="icon-btn" href="#optionen" id="optLink" aria-label="Optionen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a>
  </div>
</header>
<nav class="tabs mob" id="tabsMob" aria-label="Bereiche"></nav>
<main class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Brotkrumen" hidden></nav>
  <section class="view" id="v-home" hidden></section>
  <section class="view" id="v-start" hidden></section>
  <section class="view" id="v-lektion" hidden></section>
  <section class="view" id="v-lernen" hidden></section>
  <section class="view" id="v-karten" hidden></section>
  <section class="view" id="v-quiz" hidden></section>
  <section class="view" id="v-statistik" hidden></section>
  <section class="view" id="v-optionen" hidden></section>
  <noscript><p>Das Lernstudio braucht JavaScript.</p></noscript>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
